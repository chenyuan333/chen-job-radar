services:
  - type: web
    name: 医疗岗位雷达
    runtime: python
    repo: https://github.com/chenyuan333/chen-job-radar
    branch: main
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.9"
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
